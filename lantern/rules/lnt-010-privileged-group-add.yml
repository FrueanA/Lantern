id: LNT-010
title: Member added to a privileged group
severity: high
attack: [T1098]
description: >
  An account was added to a built-in privileged group, locally (4732) or in
  Active Directory (4728, 4756). Attackers grant themselves admin rights to
  keep access.
detection:
  member_added:
    EventID: [4728, 4732, 4756]
    Channel: Security
  privileged_group:
    TargetUserName:
      - Administrators
      - Domain Admins
      - Enterprise Admins
      - Schema Admins
      - Account Operators
      - Backup Operators
      - Server Operators
      - DnsAdmins
  condition: member_added and privileged_group
fields: [TargetUserName, MemberName, MemberSid, SubjectUserName]
falsepositives:
  - Approved access changes; confirm against the ticketing system
references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732
tests:
  match:
    - {EventID: 4732, Channel: Security, TargetUserName: Administrators, SubjectUserName: j.alvarez}
    - {EventID: 4728, Channel: Security, TargetUserName: domain admins}
  nomatch:
    - {EventID: 4732, Channel: Security, TargetUserName: Remote Desktop Users}
