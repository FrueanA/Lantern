id: LNT-002
title: Password spraying from a single source
type: threshold
severity: high
attack: [T1110.003]
description: >
  One source address failed to log on as many different accounts in a short
  time. Spraying tries one or two common passwords against many accounts to
  stay under per-account lockout thresholds.
detection:
  failed_logon:
    EventID: 4625
    Channel: Security
  condition: failed_logon
threshold:
  group_by: [IpAddress]
  distinct: TargetUserName
  count: 8
  window: 10m
fields: [IpAddress, TargetUserName, LogonType, WorkstationName]
falsepositives:
  - A misconfigured service or shared kiosk cycling through stale credentials
references:
  - https://attack.mitre.org/techniques/T1110/003/
