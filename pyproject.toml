[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-hunt"
version = "0.1.0"
description = "SIEM-less threat hunting for Windows event logs, with Sigma-style rules mapped to MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Audrey Fruean" }]
keywords = ["threat-hunting", "detection-engineering", "windows-event-logs", "sigma", "mitre-attack", "dfir"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
evtx = ["python-evtx>=0.7.4"]

[project.scripts]
lantern = "lantern.cli:main"

[project.urls]
Repository = "https://github.com/FrueanA/lantern"

[tool.setuptools]
packages = ["lantern"]

[tool.setuptools.package-data]
lantern = ["rules/*.yml"]
