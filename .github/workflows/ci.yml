name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .
      - name: Unit and scenario tests
        run: python -m unittest discover -s tests -t . -v
      - name: Embedded rule tests
        run: lantern rules --test
      - name: Hunt the sample dataset
        run: lantern hunt samples/attack_scenario.jsonl --html hunt-report.html --json findings.json --no-color
      - name: Benign baseline must stay clean
        run: lantern hunt samples/benign_baseline.jsonl --fail-on info --quiet
      - name: Upload report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hunt-report
          path: |
            hunt-report.html
            findings.json
